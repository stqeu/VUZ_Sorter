; =============================================================================
; UKÁŽKA pre GitHub – rovnaké demo dáta ako demo.ini, výstup ide do ukazka_vystupu/
; (ten sa nahráva do repa). Namiesto skratiek .lnk vznikne README.md v každom priečinku
; zariadenia a PREHLAD.md – na GitHube sa dá preklikať zo zariadenia na dokument.
; Skript odmietne zapisovať do ukazka_vystupu čokoľvek iné než demo_data.
; Spustenie: UKAZKA.bat
; =============================================================================

[projekt]
nazov = BRHCK DEMO
masterdata = ../demo_data/MasterData_DEMO.xlsx

; jeden alebo viac priečinkov (každý na novom riadku, odsadený)
zdroje =
    ../demo_data/neroztriedene

vystup = ../ukazka_vystupu

; kopia = každý dokument sa uloží RAZ do vystup/_dokumenty, pri tagoch sú iba odkazy
; zdroj = dokumenty ostanú kde sú, odkazy vedú priamo na zdrojové súbory
ulozisko = kopia

; auto = na Windows .lnk skratky, inde symbolické odkazy
; url  = .url súbory (fungujú na Windows aj bez PowerShellu)
; markdown = README.md v priečinku zariadenia s odkazmi (čitateľné na GitHube)
typ_odkazu = markdown

; ako sa volajú priečinky zariadení:
;   {tag}               -> 11E101
;   {tag_bez_jednotky}  -> E101
;   príklad starého formátu:  BRHCK_LTA_{tag_bez_jednotky}_r0
format_priecinka = {tag}
vytvorit_prazdne_priecinky = nie

typy_suborov = .pdf .docx .doc .rtf .xlsx .xlsm .xls .txt .csv .jpg .jpeg .png .tif .tiff
; tieto typy sa nečítajú, priradia sa iba podľa názvu súboru / priečinka
typy_len_nazov = .dwg .dxf .zip .7z .msg

; strana PDF s menej znakmi = pravdepodobne sken -> označí sa „potrebuje OCR“
min_znakov_na_stranu = 50

; berú sa iba riadky s Part of scope = Y
len_v_rozsahu = ano

[parovanie]
; pravidlo 4 – predpona jednotky, ktorá môže v dokumentoch chýbať (V109A = 11V109A, iba na kontrolu)
predpona_jednotky = 11
povolit_bez_predpony = ano

; pravidlo 6 – tag s kanonickou dĺžkou <= N znakov alebo bez číslice je nejednoznačný
; (v obsahu ide na ručnú kontrolu, v názve súboru/priečinka sa priradí automaticky)
max_dlzka_kratkeho_tagu = 5
; ďalšie nejednoznačné tagy (vzory, oddelené medzerou)
nejednoznacne_navyse = PLUG-VALVE-*

[ocr]
; Lokálne OCR – nič neodchádza mimo počítača. Ak Tesseract nie je nainštalovaný,
; skript beží ďalej a skeny ostanú v stave „potrebuje OCR“.
zapnute = ano
jazyky = slk+ces+eng
; prázdne = nájde sám (PATH alebo C:\Program Files\Tesseract-OCR)
tesseract =
; PDF cez OCRmyPDF (vyrobí aj prehľadávateľné PDF); bez neho priamo Tesseract (iba text)
ocrmypdf = ano
; odkaz pri tagu povedie na prehľadávateľnú verziu skenu (originál ostáva vedľa)
prehladavatelne_pdf = ano
; zhody po oprave zámen O/0, I/1, S/5, B/8 … (napr. 11V1O9A) -> na kontrolu
oprava_zamien = ano
max_stran = 200
casovy_limit_s = 900
paralelne = 2

; -----------------------------------------------------------------------------
; Hárky MasterData. stlpec_* = text hlavičky (riadok s hlavičkou sa nájde sám).
; -----------------------------------------------------------------------------
[harok:Static]
stlpec_tag = Tag No
stlpec_rozsah = Part of scope
priecinok = Static

[harok:Rotating]
stlpec_tag = Tag No
stlpec_rozsah = Part of scope
priecinok = Rotating

[harok:Electric]
stlpec_tag = Tag No
stlpec_rozsah = Part of scope
priecinok = Electric

[harok:Instrumentation]
stlpec_tag = Tag No
stlpec_rozsah = Part of scope
priecinok = Instrumentation

[harok:Pipes]
stlpec_tag = Pipeline name
stlpec_rozsah = Part of scope
priecinok = Pipes
; pravidlo 7 – berie sa časť názvu pred zátvorkou, DN50 = 2"
potrubia = ano
